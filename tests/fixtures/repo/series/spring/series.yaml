template: flyer
defaults:
  slots:
    body: copy/body.md
    photo:hero: {src: kitchen.jpg, fit: fill, focus: [0.5, 0.35]}
  overrides:
    Band: {opacity: 0.9}
variants:
  - doc: open-house
    slots:
      headline: Open House, April 12
  - doc: garden
    slots:
      headline: Garden Party
    overrides:
      headline: {size: 54}
