[project]
name = "makeready"
version = "0.1.0"
description = "Compile Figma templates and YAML specs into InDesign documents and print PDFs"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "fonttools>=4.50",
    "pillow>=10",
    "pikepdf>=10.17.0",
]

[project.scripts]
makeready = "makeready.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
